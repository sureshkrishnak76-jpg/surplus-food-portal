apiVersion: apps/v1
kind: Deployment
metadata:
  name: surplus-food-portal
  labels:
    app: surplus-food-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: surplus-food-portal
  template:
    metadata:
      labels:
        app: surplus-food-portal
    spec:
      containers:
      - name: surplus-food-portal
        image: sureshkrishnak/surplus-food-portal:build-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: surplus-food-service
spec:
  type: NodePort
  selector:
    app: surplus-food-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
