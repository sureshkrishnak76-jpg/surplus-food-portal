apiVersion: apps/v1
kind: Deployment
metadata:
name: surplus-food-portal
spec:
replicas: 2
revisionHistoryLimit: 5

selector:
matchLabels:
app: surplus-food-portal

template:
metadata:
labels:
app: surplus-food-portal

```
spec:
  containers:
    - name: surplus-food-portal
      image: YOUR_DOCKERHUB_USERNAME/surplus-food-portal:v1
      imagePullPolicy: Always

      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
```

---

apiVersion: v1
kind: Service
metadata:
name: surplus-food-service

spec:
type: NodePort

selector:
app: surplus-food-portal

ports:
- port: 80
targetPort: 80
nodePort: 30080
